name: CI

on:
  push:
    branches: [Main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-only-secret-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build reads the catalogue: the prebuild step writes llms-full.txt
      # from it and every product/category page is prerendered. Against the
      # empty ci.db it failed with "no such table: main.Product", so the
      # Build step was red from the start. Migrate and seed a throwaway copy.
      - name: Prepare database
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Build
        run: npm run build
